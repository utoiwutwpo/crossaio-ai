<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to CrossAIO</title>
<link rel="alternate" hreflang="zh" href="http://localhost:9000/signin">
<link rel="alternate" hreflang="en" href="http://localhost:9000/en/signin">
<link rel="alternate" hreflang="de" href="http://localhost:9000/de/signin">
<link rel="alternate" hreflang="fr" href="http://localhost:9000/fr/signin">
<link rel="alternate" hreflang="x-default" href="http://localhost:9000/signin">
<style>
  :root{--blue:#1a6bff;--blue-dark:#1557d0;--ink:#1a2b4c;--muted:#7a8699;--border:#d9dfe8;--err:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:#fff;color:var(--ink);
       min-height:100vh;display:flex;flex-direction:column;line-height:1.6}
  a{text-decoration:none;color:var(--blue)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:56px 20px 40px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin-bottom:26px}
  .logo .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#8b5cf6);
       display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;color:#123c7d;margin-bottom:28px;text-align:center}
  .card{width:100%;max-width:400px}
  .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;
       border:1px solid var(--blue);border-radius:6px;padding:13px 16px;font-size:15px;font-weight:600;
       color:var(--blue);cursor:pointer;transition:background .15s}
  .btn-google:hover{background:#f4f8ff}
  .divider{border-top:1px solid #e7ebf1;margin:26px 0}
  label{display:block;font-size:14px;color:#3c4a63;margin:16px 0 6px}
  input[type=email],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:5px;
       font-size:14px;color:var(--ink);background:#fff}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,107,255,.12)}
  .row-right{text-align:right;margin-top:6px}
  .row-right a{font-size:13px}
  .remember{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:14px}
  .remember input{width:16px;height:16px;accent-color:var(--blue)}
  .remember small{color:var(--muted)}
  .btn-primary{width:100%;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:14px;
       font-size:15px;font-weight:700;letter-spacing:.06em;cursor:pointer;margin-top:20px}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-primary:disabled{background:#9dbef0;cursor:not-allowed}
  .msg{padding:11px 14px;border-radius:6px;font-size:13px;margin-top:14px;display:none}
  .msg.err{display:block;background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .msg.info{display:block;background:#eff6ff;color:var(--blue-dark);border:1px solid #bfdbfe}
  .below{text-align:center;font-size:14px;margin-top:22px;color:#3c4a63}
  .below+p{text-align:center;font-size:13px;margin-top:10px;color:var(--muted)}
  footer{border-top:1px solid #eef1f5;padding:18px 24px;display:flex;justify-content:space-between;
       flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
  footer a{color:var(--muted);margin:0 6px}
  #gbtn{margin-top:4px}
</style>
</head>
<body>
<main>
  <div class="logo"><span class="dot">🤖</span>CrossAIO</div>
  <h1>Sign in to CrossAIO</h1>
  <div class="card">
    <button class="btn-google" id="btnGoogle" onclick="googleFlow()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
      Continue with Google
    </button>
    <div id="gbtn"></div>
    <div class="divider"></div>
    <form id="form">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
      <label>Password</label>
      <input type="password" id="pass" placeholder="Enter your password" autocomplete="current-password" required>
      <div class="row-right"><a href="#" onclick="return false" title="Coming soon">Forgot password?</a></div>
      <div class="remember"><input type="checkbox" id="rem" checked> <span>Remember me <small>(recommended on a private computer)</small></span></div>
      <button class="btn-primary" id="btnLogin" type="submit">Sign in</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="below">No account yet? <a href="/en/signup">Sign up now</a></p>
    <p>Questions? <a href="mailto:support@crossaio.ai">Contact us</a></p>
  </div>
</main>
<footer>
  <div><a href="/en/privacy">Privacy Policy</a>|<a href="/en/terms">Terms of Service</a></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="lang-switch" role="navigation" aria-label="Language" style="display:inline-flex;gap:6px;align-items:center">
      <a href="/signin" data-lang="zh" style="text-decoration:none;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:#334155">中文</a>
      <a href="/en/signin" data-lang="en" style="text-decoration:none;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#2563eb;color:#fff" aria-current="page">EN</a>
      <a href="/de/signin" data-lang="de" style="text-decoration:none;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:#334155">DE</a>
      <a href="/fr/signin" data-lang="fr" style="text-decoration:none;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:#334155">FR</a>
    </div>
    <span>CrossAIO © 2026</span>
  </div>
</footer>

<script>
const API = "/api/v1";
const msg = document.getElementById("msg");
function show(t, cls){ msg.className = "msg "+cls; msg.textContent = t; }

// Google OAuth callback fallback: when the URL carries a token, store it and go straight to the workbench (the normal path already lands on /app)
(function(){
  const t = new URLSearchParams(location.search).get("token");
  if(t){ localStorage.setItem("cb_token", t); location.replace("/en/app"); }
})();

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnLogin");
  btn.disabled = true; btn.textContent = "Signing in…";
  try{
    const r = await fetch(API+"/users/login", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("email").value.trim(),
                           password:document.getElementById("pass").value})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || "Sign in failed");
    localStorage.setItem("cb_token", d.access_token);
    if(document.getElementById("rem").checked === false) sessionStorage.setItem("cb_session_only","1");
    location.href = "/en/app";
  }catch(err){ show(err.message, "err"); }
  btn.disabled = false; btn.textContent = "Sign in";
};

// Google sign-in: server-side OAuth2 authorization code flow (redirect to Google consent → callback → bounce back with token)
async function googleFlow(){
  const cfg = await (await fetch(API+"/users/google-config")).json();
  if(!cfg.enabled){
    show("Google sign-in is not enabled yet: configure GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in backend/.env and register the redirect URI http://localhost:9000/users/google in the Google Console (see README). Please sign in with email for now.", "info");
    return;
  }
  location.href = "/users/google?next=/app";
}
</script>
<script>(function(){try{localStorage.setItem("crossaio_lang",document.documentElement.lang||"zh")}catch(e){}})();</script>
</body>
</html>
